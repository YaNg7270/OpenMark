<!--
  OpenMark application mark — original artwork.

  A rounded square holding a downward chevron above a rule: a reference to the
  markdown block-quote and heading syntax, without reproducing any other product's
  icon or logotype. Drawn as paths so it scales to any window or installer size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OpenMark">
  <defs>
    <linearGradient id="om-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#om-mark)" />
  <path
    d="M16 22 L26 32 L16 42"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path d="M33 42 H48" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85" />
  <path d="M33 22 H48" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.55" />
</svg>
