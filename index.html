<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      No remote origins are permitted. The app is designed to run fully offline, so this
      CSP is defence in depth alongside the one in tauri.conf.json. `unsafe-inline` for
      styles is required by MathJax and Mermaid, which both emit inline styles; script
      execution stays limited to same-origin bundles.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: asset: http://asset.localhost; font-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost ws://localhost:*; object-src 'none'; base-uri 'self'; form-action 'none'; worker-src 'self' blob:"
    />
    <title>OpenMark</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
